# =============================================================================
# BSupervisor Demo Stack
# =============================================================================
# Public interactive demo deployment.
#
# - Per-visitor ephemeral tenants (auto-created on /api/v1/demo/session)
# - Separate JWT issuer (DEMO_JWT_SECRET)
# - Receives audit events from other demo backends (api-demo-nexus, etc.)
# - No external webhooks (fully self-contained)
#
# Ports (see ~/Works/_infra/port-map.md):
#   APP   9000
#   PG    5937
#
# Domain: api-demo-supervisor.bsvibe.dev → localhost:9000 (via Caddy)
#
# Usage:
#   docker compose -f deploy/docker-compose.demo.yml --env-file deploy/.env.demo up -d
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    container_name: bsupervisor-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bsupervisor_demo
      POSTGRES_USER: bsupervisor_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5937:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsupervisor_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - bsupervisor-demo-network

  app:
    logging: *default-logging
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bsupervisor-demo-app
    restart: unless-stopped
    ports:
      - "9000:8000"
    env_file:
      - .env.demo
    environment:
      DATABASE_URL: postgresql+asyncpg://bsupervisor_demo:${POSTGRES_PASSWORD}@postgres:5432/bsupervisor_demo
      BSVIBE_DEMO_MODE: "true"
      DEMO_JWT_SECRET: ${DEMO_JWT_SECRET:?DEMO_JWT_SECRET is required for demo backend}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    volumes:
      - ../logs-demo:/app/logs
    networks:
      - bsupervisor-demo-network

volumes:
  postgres-data:
    name: bsupervisor-demo-postgres-data

networks:
  bsupervisor-demo-network:
    driver: bridge
    name: bsupervisor-demo-network
