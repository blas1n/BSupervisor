[project]
name = "bsupervisor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "structlog>=23.0.0",
    "bsvibe-auth[fastapi] @ git+https://github.com/BSVibe/BSVibe-Auth.git@v0.5.0#subdirectory=python",
    # Phase A shared packages (bsvibe-python). All packages pinned to
    # ``integration/phase-a`` while feature branches consolidate onto main.
    # Switch to versioned releases once that branch merges.
    # All packages pinned to ``integration/phase-audit-batch-2`` so uv resolves
    # a single ``bsvibe-core`` revision shared by every shared package
    # (``integration/phase-a`` + audit drop). Switch to versioned releases once
    # the integration branch merges.
    "bsvibe-core @ git+https://github.com/BSVibe/bsvibe-python.git@main#subdirectory=packages/bsvibe-core",
    "bsvibe-fastapi @ git+https://github.com/BSVibe/bsvibe-python.git@main#subdirectory=packages/bsvibe-fastapi",
    "bsvibe-sqlalchemy @ git+https://github.com/BSVibe/bsvibe-python.git@main#subdirectory=packages/bsvibe-sqlalchemy",
    "bsvibe-alerts @ git+https://github.com/BSVibe/bsvibe-python.git@main#subdirectory=packages/bsvibe-alerts",
    # P0.5 — shared authz library. Phase 5b bumps to ``main`` to pick up
    # ``IntrospectionClient`` + ``verify_bootstrap_token`` + ``require_scope``
    # for the 3-way dispatch wired in ``bsupervisor/api/deps.py``.
    "bsvibe-authz @ git+https://github.com/BSVibe/bsvibe-python.git@main#subdirectory=packages/bsvibe-authz",
    # Phase 5b — shared CLI foundation. Provides ``cli_app`` factory,
    # ``ProfileStore``, ``OutputFormatter``, ``CliHttpClient`` (401-refresh
    # retry), and ``DeviceFlowClient`` for the new ``bsupervisor`` Typer CLI.
    "bsvibe-cli-base @ git+https://github.com/BSVibe/bsvibe-python.git@main#subdirectory=packages/bsvibe-cli-base",
    # Phase Audit Batch 2 — outbox-pattern audit emission. Producer-only:
    # BSupervisor inserts events into its own ``audit_outbox`` table inside
    # the request's transaction; ``OutboxRelay`` ships them to BSVibe-Auth.
    "bsvibe-audit @ git+https://github.com/BSVibe/bsvibe-python.git@main#subdirectory=packages/bsvibe-audit",
    # Demo stack helpers — JWT, LLM mock guard, tenant GC.
    # Lives on feat/bsvibe-demo until merged.
    "bsvibe-demo @ git+https://github.com/BSVibe/bsvibe-python.git@main#subdirectory=packages/bsvibe-demo",
    "httpx>=0.28.1",
]

[project.scripts]
bsupervisor = "bsupervisor.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["bsupervisor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.coverage.run]
source = ["bsupervisor"]
omit = ["*/migrations/*", "bsupervisor/models/database.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.0",
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.1.1",
    "ruff>=0.11.0",
]
